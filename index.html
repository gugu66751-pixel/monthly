<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="stlyesheet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">

  <title>Frontend Mentor | Order summary card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <div class="container">
    <div class="cover"><img src="images\illustration-hero.svg" alt=""></div>
    <div><h3>Order Summary</h3></div>
    <div><p>  You can now listen to millions of songs, audiobooks, and podcasts on any 
              device anywhere you like!</p></div>
    <div class="plan">
      <div class="icon"><img src="images\icon-music.svg" alt=""></div>
      <div class="plan_cat"><p>Annual Plan</p></div>
      <div class="price"><p>$59.99/year</p></div>
      <a href="">Change</a>
    </div>
    <div class="process"><nav>Proceed to Payment</nav></div>
    <div class="cancel"><nav>Cancel Order</nav></div>
  </div>








  <!-- Order Summary

  You can now listen to millions of songs, audiobooks, and podcasts on any 
  device anywhere you like!

  Annual Plan
  $59.99/year

  Change

  Proceed to Payment
  Cancel Order
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer> -->
</body>
</html>
